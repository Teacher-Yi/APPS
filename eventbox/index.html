<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>친목회 깜짝 이벤트</title>
<style>
:root{--bg1:#fff7fb;--bg2:#f4fbff;--card:#fff;--ink:#25243a;--muted:#69677a;--pink:#ff5f9e;--purple:#7457ff;--line:#eee8f4;--bad:#e04f5f}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif;color:var(--ink);background:linear-gradient(150deg,var(--bg1),var(--bg2));min-height:100vh}.wrap{width:min(560px,100%);margin:0 auto;padding:22px 16px 44px}.hero{text-align:center;padding:12px 0 14px}.badge{font-size:42px;margin-bottom:8px}h1{font-size:28px;line-height:1.25;margin:0;font-weight:950}h2{font-size:20px;margin:8px 0 0}.subtitle{margin-top:10px;color:var(--muted);font-weight:750}.card{background:rgba(255,255,255,.93);border:1px solid var(--line);border-radius:26px;box-shadow:0 14px 36px rgba(116,87,255,.12);padding:20px;margin:14px 0}label{display:block;font-weight:900;margin:14px 0 7px}input,textarea{width:100%;border:1px solid var(--line);border-radius:18px;padding:15px 16px;font-size:18px;outline:none;background:#fff}textarea{min-height:132px;resize:vertical;line-height:1.5}input:focus,textarea:focus{border-color:var(--purple);box-shadow:0 0 0 4px rgba(116,87,255,.12)}.notice{background:#fff9e8;border:1px solid #ffe6a6;border-radius:18px;padding:12px 14px;font-size:14px;color:#6b5520;line-height:1.5;margin-top:12px}button{width:100%;border:0;border-radius:18px;padding:16px 15px;font-size:18px;font-weight:950;color:#fff;background:linear-gradient(135deg,var(--pink),var(--purple));box-shadow:0 10px 22px rgba(116,87,255,.22);cursor:pointer;margin-top:16px}button:disabled{opacity:.55;cursor:not-allowed}button.secondary{background:#fff;color:var(--purple);border:1px solid var(--line);box-shadow:none}.hidden{display:none!important}.center{text-align:center}.drum{font-size:26px;font-weight:950;margin:14px 0 6px}.spinner-code{font-size:76px;font-weight:1000;letter-spacing:.03em;margin:14px auto;width:190px;height:125px;border-radius:30px;display:flex;align-items:center;justify-content:center;background:linear-gradient(150deg,#fff,#fff5fb);border:2px dashed #ffc3df}.result-code{font-size:86px;font-weight:1000;margin:14px auto 10px;width:210px;height:142px;border-radius:34px;display:flex;align-items:center;justify-content:center;color:#fff;background:linear-gradient(135deg,var(--pink),var(--purple));box-shadow:0 18px 40px rgba(116,87,255,.28)}.result-title{font-size:28px;font-weight:1000;margin:10px 0}.result-msg{font-size:19px;line-height:1.65;font-weight:850}.tiny{font-size:13px;color:var(--muted);line-height:1.5}.error{background:#fff1f3;color:#9e2231;border:1px solid #ffd2d9;border-radius:18px;padding:12px 14px;margin-top:12px;line-height:1.5;font-weight:800}.success{background:#eafbf3;color:#08764a;border:1px solid #bdebd4;border-radius:18px;padding:12px 14px;margin-top:12px;line-height:1.5;font-weight:800}.admin-link{text-align:center;margin-top:18px;font-size:13px}.admin-link a{color:var(--muted);text-decoration:none}table{width:100%;border-collapse:collapse;font-size:14px;margin-top:12px}th,td{border-bottom:1px solid var(--line);padding:9px 6px;text-align:left}th{color:var(--muted)}.stock-pill{display:inline-flex;align-items:center;gap:6px;padding:8px 10px;border-radius:999px;background:#f7f4ff;border:1px solid #e2dafa;font-weight:900;margin:4px}
</style>
</head>
<body>
<div class="wrap">
<section id="entry">
<div class="hero"><div class="badge">🎊</div><h1>친목회 깜짝 이벤트! 🎊</h1><h2>학기말 경품 추첨</h2><div class="subtitle">행운의 주인공은 누구일까요?</div></div>
<div class="card">
<label for="name">본인의 이름</label><input id="name" placeholder="예: 홍길동" autocomplete="name">
<label for="message">💛 응원의 한마디</label><div class="tiny" style="margin-bottom:8px">한 학기 동안 함께해 주신 동료 교직원들에게 응원의 한마디를 남겨주세요.</div><textarea id="message" placeholder="마음을 담아 자유롭게 남겨주세요."></textarea>
<div class="notice">✨ 응원의 한마디는 익명으로 공유될 수 있습니다.</div>
<button id="drawBtn" onclick="submitAndDraw()">🎁 응원 남기고 추첨하기</button><div id="entryMsg"></div>
</div><div class="admin-link"><a href="#admin" onclick="showAdminLogin()">친목회장 확인용</a></div>
</section>
<section id="drawing" class="hidden"><div class="card center"><div style="font-size:44px">🎁 🎊 ⭐ 🍀 🎉</div><div class="drum">두구두구두구두구...</div><div id="spinCode" class="spinner-code">?</div><div class="tiny">행운의 코드가 정해지는 중입니다.</div></div></section>
<section id="result" class="hidden"><div class="card center"><div style="font-size:46px">🎉</div><div class="result-title" id="resultTitle">축하합니다!</div><div id="resultCode" class="result-code">ㄱ</div><div class="result-msg">당첨되었습니다.<br><br>👇<br>친목회장을 찾아가<br>상품을 받으세요~</div><div class="notice" style="margin-top:18px">※ 이 화면을 친목회장님께 보여주세요.</div><div id="ticketInfo" class="tiny" style="margin-top:12px"></div></div></section>
<section id="admin" class="hidden"><div class="hero"><div class="badge">🔐</div><h1>친목회장 확인용</h1><div class="subtitle">재고와 참여기록을 확인합니다.</div></div><div id="adminLogin" class="card"><label for="adminPw">비밀번호</label><input id="adminPw" type="password" placeholder="비밀번호 입력"><button onclick="loadAdmin()">확인</button><button class="secondary" onclick="goEntry()">처음 화면으로</button><div id="adminMsg"></div></div><div id="adminPanel" class="card hidden"><h2 style="margin-top:0">남은 경품</h2><div id="stockArea"></div><h2>최근 참여기록</h2><div id="recordArea"></div><button class="secondary" onclick="loadAdmin()">새로고침</button><button class="secondary" onclick="goEntry()">처음 화면으로</button></div></section>
</div>
<script>
const API_URL="https://script.google.com/macros/s/AKfycbxbjIF56Q_yOn4psYRMxjKkJK4ZvcilWBFBjRFRcB1bUO_kSNQlxLqQGNVaLa99zgAJ/exec";
const ADMIN_PASSWORD="0000";
const SAMPLE_CODES=["ㄱ","ㅅ","ㅈ","ㅎ","ㅁ","LD","🎁","🎊","🍀","⭐"];
function $(id){return document.getElementById(id)}function showOnly(id){["entry","drawing","result","admin"].forEach(x=>$(x).classList.add("hidden"));$(id).classList.remove("hidden")}function goEntry(){showOnly("entry")}function showAdminLogin(){showOnly("admin");$("adminLogin").classList.remove("hidden");$("adminPanel").classList.add("hidden")}function setMessage(id,text,type="error"){$(id).innerHTML=text?`<div class="${type}">${escapeHtml(text)}</div>`:""}
async function submitAndDraw(){const name=$("name").value.trim();const message=$("message").value.trim();if(!name){setMessage("entryMsg","본인의 이름을 입력해 주세요.");$("name").focus();return}if(!message){setMessage("entryMsg","응원의 한마디를 입력해 주세요.");$("message").focus();return}if(!API_URL||API_URL.includes("PASTE_APPS_SCRIPT")){setMessage("entryMsg","아직 Apps Script 웹앱 URL이 설정되지 않았습니다.");return}$("drawBtn").disabled=true;setMessage("entryMsg","");showOnly("drawing");const spinTimer=startSpin();try{const response=await fetch(API_URL,{method:"POST",mode:"cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({action:"draw",name,message})});const data=await response.json();await wait(2600);clearInterval(spinTimer);if(!data.ok){showOnly("entry");$("drawBtn").disabled=false;setMessage("entryMsg",data.message||"처리 중 문제가 발생했습니다.");return}showResult(data)}catch(err){clearInterval(spinTimer);showOnly("entry");$("drawBtn").disabled=false;setMessage("entryMsg","연결 오류가 발생했습니다. 잠시 후 다시 시도해 주세요.")}}
function startSpin(){let i=0;return setInterval(()=>{$("spinCode").textContent=SAMPLE_CODES[i%SAMPLE_CODES.length];i++},90)}function showResult(data){showOnly("result");$("resultCode").textContent=data.code;$("resultTitle").textContent=data.code==="LD"?"Lucky Draw!":"축하합니다!";$("ticketInfo").textContent=data.ticket?`당첨번호 ${data.ticket}`:""}
async function loadAdmin(){const pw=$("adminPw").value;if(pw!==ADMIN_PASSWORD){setMessage("adminMsg","비밀번호가 맞지 않습니다.");return}if(!API_URL||API_URL.includes("PASTE_APPS_SCRIPT")){setMessage("adminMsg","아직 Apps Script 웹앱 URL이 설정되지 않았습니다.");return}setMessage("adminMsg","불러오는 중입니다.","success");try{const res=await fetch(API_URL+"?action=status");const data=await res.json();if(!data.ok){setMessage("adminMsg",data.message||"상태를 불러오지 못했습니다.");return}$("adminMsg").innerHTML="";$("adminLogin").classList.add("hidden");$("adminPanel").classList.remove("hidden");$("stockArea").innerHTML=data.prizes.map(p=>`<span class="stock-pill">${escapeHtml(p.code)} <b>${p.remaining}</b></span>`).join("")+`<div class="tiny" style="margin-top:8px">총 남은 수량: ${data.totalRemaining}</div>`;$("recordArea").innerHTML=(!data.records||!data.records.length)?`<div class="tiny">아직 참여기록이 없습니다.</div>`:`<table><thead><tr><th>이름</th><th>코드</th><th>응원글</th></tr></thead><tbody>${data.records.map(r=>`<tr><td>${escapeHtml(r.name)}</td><td><b>${escapeHtml(r.code)}</b></td><td>${escapeHtml(r.message)}</td></tr>`).join("")}</tbody></table>`}catch(err){setMessage("adminMsg","연결 오류가 발생했습니다.")}}
function wait(ms){return new Promise(resolve=>setTimeout(resolve,ms))}function escapeHtml(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
</script>
</body>
</html>
