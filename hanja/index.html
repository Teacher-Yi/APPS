<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>한자와의 만남</title>
<style>
  :root {
    --bg:#f5fbf8; --card:#ffffff; --ink:#17233d; --muted:#637083;
    --accent:#2aa876; --accent2:#177456; --bad:#e55353; --line:#dbe9e3;
  }
  * { box-sizing:border-box; }
  body {
    margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif;
    background:var(--bg); color:var(--ink);
  }
  .wrap { max-width:560px; margin:0 auto; padding:22px 16px 40px; }
  header { text-align:center; padding:12px 0 18px; }
  .app-title { font-size:30px; font-weight:900; margin:6px 0 4px; }
  .sub { color:var(--muted); font-size:14px; }
  .card {
    background:var(--card); border:1px solid var(--line); border-radius:22px;
    padding:18px; box-shadow:0 8px 24px rgba(23,35,61,.06); margin:12px 0;
  }
  button {
    width:100%; border:0; border-radius:16px; padding:15px 14px;
    font-size:17px; font-weight:800; background:var(--accent); color:white;
    cursor:pointer; margin:7px 0;
  }
  button.secondary { background:#eef6f2; color:var(--accent2); border:1px solid var(--line); }
  button.ghost { background:#fff; color:var(--muted); border:1px solid var(--line); }
  button.danger { background:#fff1f1; color:var(--bad); border:1px solid #ffd1d1; }
  .lesson-btn { text-align:left; display:flex; justify-content:space-between; gap:12px; align-items:center; }
  .count { font-size:13px; color:var(--muted); font-weight:700; }
  .row { display:flex; gap:10px; }
  .row button { flex:1; }
  .progress { color:var(--muted); font-weight:800; font-size:14px; margin-bottom:10px; }
  .hanja {
    font-family:"Noto Serif CJK KR","Noto Serif KR","Apple SD Gothic Neo",serif;
    font-size:96px; line-height:1.05; text-align:center; font-weight:900; margin:14px 0 20px;
  }
  label { display:block; font-weight:900; margin:12px 0 6px; }
  input {
    width:100%; padding:15px 14px; border-radius:14px; border:1px solid var(--line);
    font-size:20px; outline:none; background:#fbfffd;
  }
  input:focus { border-color:var(--accent); box-shadow:0 0 0 3px rgba(42,168,118,.14); }
  .result { font-size:18px; font-weight:900; margin:14px 0; line-height:1.7; }
  .ok { color:var(--accent2); }
  .no { color:var(--bad); }
  .answer-box { background:#f7faf8; border:1px dashed var(--line); border-radius:14px; padding:12px 14px; margin:12px 0; }
  .wrong-list { display:flex; flex-wrap:wrap; gap:8px; margin:12px 0; }
  .pill { border:1px solid var(--line); background:#f8fcfa; border-radius:999px; padding:7px 11px; font-weight:900; }
  .hidden { display:none !important; }
  .score { text-align:center; font-size:22px; font-weight:900; line-height:1.6; }
  .small { font-size:13px; color:var(--muted); line-height:1.5; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div style="font-size:42px">📖</div>
    <div class="app-title">한자와의 만남</div>
    <div class="sub">뜻·음 암기</div>
  </header>

  <main id="home" class="card">
    <h2 style="margin:0 0 10px">단원 선택</h2>
    <div id="lessonList"></div>
    <button class="lesson-btn" onclick="selectLesson('__ALL__')"><span>전체 범위 랜덤</span><span class="count" id="allCount"></span></button>
    <p class="small">구글 시트 수정본 기준으로 업데이트한 버전입니다.</p>
  </main>

  <section id="mode" class="card hidden">
    <h2 id="modeTitle" style="margin:0 0 10px"></h2>
    <button onclick="startQuiz(false)">순서대로 풀기</button>
    <button onclick="startQuiz(true)">랜덤으로 풀기</button>
    <button class="ghost" onclick="goHome()">처음으로</button>
  </section>

  <section id="quiz" class="card hidden">
    <div class="progress" id="progress"></div>
    <div class="hanja" id="hanja">漢</div>
    <label for="meaningInput">뜻</label>
    <input id="meaningInput" autocomplete="off" placeholder="뜻을 입력하세요" />
    <label for="soundInput">음</label>
    <input id="soundInput" autocomplete="off" placeholder="음을 입력하세요" />
    <button id="checkBtn" onclick="checkAnswer()">정답 확인</button>
    <div id="feedback" class="hidden"></div>
  </section>

  <section id="finish" class="card hidden">
    <div class="score" id="scoreText"></div>
    <div id="wrongArea"></div>
    <button id="retryWrongBtn" class="hidden" onclick="retryWrong()">틀린 문제 다시 풀기</button>
    <button class="secondary" onclick="goHome()">처음으로</button>
  </section>
</div>

let selectedLesson = null;
let currentSet = [];
let index = 0;
let correctCount = 0;
let wrongItems = [];
let answered = false;

const $ = (id) => document.getElementById(id);

function normalize(s) {
  return String(s || "").replace(/\s+/g,"").replace(/[.,，、]/g,",").trim();
}

function shuffle(arr) {
  const a = [...arr];
  for (let i=a.length-1; i>0; i--) {
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function show(id) {
  ["home","mode","quiz","finish"].forEach(x => $(x).classList.add("hidden"));
  $(id).classList.remove("hidden");
}

function init() {
  const list = $("lessonList");
  list.innerHTML = "";
  Object.keys(DATA).forEach(lesson => {
    const btn = document.createElement("button");
    btn.className = "lesson-btn secondary";
    btn.innerHTML = `<span>${lesson}</span><span class="count">${DATA[lesson].length}자</span>`;
    btn.onclick = () => selectLesson(lesson);
    list.appendChild(btn);
  });
  const total = Object.values(DATA).reduce((sum, arr)=>sum+arr.length,0);
  $("allCount").textContent = total + "자";
}

function selectLesson(lesson) {
  selectedLesson = lesson;
  const title = lesson === "__ALL__" ? "전체 범위" : lesson;
  $("modeTitle").textContent = title;
  show("mode");
}

function startQuiz(random) {
  const base = selectedLesson === "__ALL__" ? Object.values(DATA).flat() : DATA[selectedLesson];
  currentSet = random ? shuffle(base) : [...base];
  index = 0;
  correctCount = 0;
  wrongItems = [];
  showQuestion();
  show("quiz");
}

function showQuestion() {
  answered = false;
  const item = currentSet[index];
  $("progress").textContent = `문제 ${index+1} / ${currentSet.length}`;
  $("hanja").textContent = item.hanja;
  $("meaningInput").value = "";
  $("soundInput").value = "";
  $("meaningInput").disabled = false;
  $("soundInput").disabled = false;
  $("feedback").classList.add("hidden");
  $("feedback").innerHTML = "";
  $("checkBtn").textContent = "정답 확인";
  $("checkBtn").onclick = checkAnswer;
  setTimeout(() => $("meaningInput").focus(), 50);
}

function checkAnswer() {
  if (answered) return nextQuestion();
  const item = currentSet[index];
  const meaningOK = normalize($("meaningInput").value) === normalize(item.meaning);
  const soundOK = normalize($("soundInput").value) === normalize(item.sound);
  const ok = meaningOK && soundOK;
  answered = true;
  if (ok) correctCount++;
  else wrongItems.push(item);

  $("meaningInput").disabled = true;
  $("soundInput").disabled = true;
  $("feedback").classList.remove("hidden");
  $("feedback").innerHTML = `
    <div class="result">
      <div class="${meaningOK ? "ok" : "no"}">뜻 ${meaningOK ? "⭕" : "❌"}</div>
      <div class="${soundOK ? "ok" : "no"}">음 ${soundOK ? "⭕" : "❌"}</div>
    </div>
    <div class="answer-box">
      <b>정답</b><br>
      뜻: ${escapeHtml(item.meaning)}<br>
      음: ${escapeHtml(item.sound)}
    </div>`;
  $("checkBtn").textContent = index === currentSet.length - 1 ? "결과 보기" : "다음 문제";
  $("checkBtn").onclick = nextQuestion;
}

function nextQuestion() {
  if (index < currentSet.length - 1) {
    index++;
    showQuestion();
  } else {
    finishQuiz();
  }
}

function finishQuiz() {
  const score = Math.round((correctCount / currentSet.length) * 100);
  $("scoreText").innerHTML = `${currentSet.length}문제 중 ${correctCount}문제 정답<br>점수: ${score}점`;
  if (wrongItems.length) {
    $("wrongArea").innerHTML = `<h3>틀린 한자</h3><div class="wrong-list">${wrongItems.map(x => `<span class="pill">${escapeHtml(x.hanja)}</span>`).join("")}</div>`;
    $("retryWrongBtn").classList.remove("hidden");
  } else {
    $("wrongArea").innerHTML = `<p class="ok" style="text-align:center;font-weight:900">모두 맞혔습니다 🎉</p>`;
    $("retryWrongBtn").classList.add("hidden");
  }
  show("finish");
}

function retryWrong() {
  currentSet = shuffle(wrongItems);
  index = 0;
  correctCount = 0;
  wrongItems = [];
  showQuestion();
  show("quiz");
}

function goHome() { show("home"); }

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
