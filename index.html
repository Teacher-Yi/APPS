<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Teacher-Yi APPS</title>
  <style>
    :root{
      --bg:#f7f9fc; --card:#ffffff; --text:#1f2937; --muted:#6b7280;
      --primary:#2563eb; --primary2:#1d4ed8; --line:#e5e7eb;
      --shadow:0 10px 30px rgba(15,23,42,.08);
    }
    *{box-sizing:border-box}
    body{
      margin:0; min-height:100vh; font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      background:linear-gradient(180deg,#eef5ff 0%, var(--bg) 45%, #fff 100%);
      color:var(--text); display:flex; justify-content:center;
    }
    .wrap{width:100%; max-width:560px; padding:28px 18px 40px}
    header{text-align:center; margin:18px 0 22px}
    .logo{font-size:46px; line-height:1; margin-bottom:10px}
    h1{font-size:30px; margin:0 0 8px; letter-spacing:-.04em}
    .sub{color:var(--muted); font-size:15px}
    .grid{display:grid; gap:14px; margin-top:20px}
    a.card{
      text-decoration:none; color:inherit; background:var(--card); border:1px solid var(--line);
      border-radius:22px; padding:20px 18px; display:flex; gap:16px; align-items:center;
      box-shadow:var(--shadow); transition:transform .12s ease, border-color .12s ease;
    }
    a.card:active{transform:scale(.985)}
    .icon{width:56px;height:56px;border-radius:18px;background:#eff6ff;display:flex;align-items:center;justify-content:center;font-size:30px;flex:0 0 auto}
    .title{font-size:21px;font-weight:800;margin-bottom:4px;letter-spacing:-.03em}
    .desc{font-size:14px;color:var(--muted);line-height:1.45}
    footer{text-align:center;color:#9ca3af;font-size:12px;margin-top:26px}
  </style>
</head>
<body>
  <main class="wrap">
    <header>
      <div class="logo">📱</div>
      <h1>Teacher-Yi APPS</h1>
      <div class="sub">수업과 학습을 위한 작은 도구 모음</div>
    </header>

    <section class="grid">
      <a class="card" href="./hanja/">
        <div class="icon">📖</div>
        <div>
          <div class="title">한자와의 만남</div>
          <div class="desc">한자 뜻과 음을 반복해서 확인하는 암기 앱</div>
        </div>
      </a>

      <a class="card" href="./random-picker/">
        <div class="icon">🎲</div>
        <div>
          <div class="title">랜덤뽑기</div>
          <div class="desc">번호·이름을 중복 없이 뽑는 수업용 선택 도구</div>
        </div>
      </a>
    </section>

    <footer>APPS 저장소 첫 화면</footer>
  </main>
</body>
</html>
